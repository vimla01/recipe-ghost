<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6ead3">
  <title>Haath ka Swaad · family recipes in their own words</title>
  <link rel="icon" href="/static/diya.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="marigold" viewBox="0 0 40 40">
        <g fill="#e8890c"><circle cx="20" cy="9" r="7"/><circle cx="31" cy="15" r="7"/><circle cx="29" cy="28" r="7"/><circle cx="16" cy="31" r="7"/><circle cx="9" cy="19" r="7"/></g>
        <g fill="#f5b324"><circle cx="20" cy="13" r="5"/><circle cx="27" cy="17" r="5"/><circle cx="25" cy="25" r="5"/><circle cx="17" cy="26" r="5"/><circle cx="13" cy="19" r="5"/></g>
        <circle cx="20" cy="20" r="4.5" fill="#c9600a"/><circle cx="19" cy="19" r="1.6" fill="#f9d36a"/>
      </symbol>
      <symbol id="leaf" viewBox="0 0 20 40"><path d="M10 0 C20 12 18 30 10 40 C2 30 0 12 10 0Z" fill="#5d7a33"/><path d="M10 4 V36" stroke="#3f5a20" stroke-width="1"/></symbol>
      <symbol id="diya" viewBox="0 0 64 48">
        <path d="M32 2 C38 12 40 18 32 26 C24 18 26 12 32 2Z" fill="#f5b324"/>
        <path d="M32 9 C35 15 35 19 32 23 C29 19 29 15 32 9Z" fill="#fff3c4"/>
        <path d="M4 28 H60 C58 40 46 46 32 46 C18 46 6 40 4 28Z" fill="#8f1d21"/>
        <path d="M4 28 H60" stroke="#c9600a" stroke-width="3" stroke-linecap="round"/>
        <circle cx="20" cy="36" r="2" fill="#f5b324"/><circle cx="32" cy="38" r="2" fill="#f5b324"/><circle cx="44" cy="36" r="2" fill="#f5b324"/>
      </symbol>
      <symbol id="play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></symbol>
      <symbol id="pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></symbol>
    </defs>
  </svg>

  <div class="toran" aria-hidden="true"></div>

  <header class="masthead">
    <a href="#/" class="brand">
      <svg class="brand-diya"><use href="#diya"/></svg>
      <span>
        <span class="brand-hi" lang="hi">हाथ का स्वाद</span>
        <span class="brand-en">Haath ka Swaad</span>
      </span>
    </a>
    <nav>
      <a href="#/" data-nav="home">Kitchen</a>
      <a href="/book" data-nav="book" target="_blank" rel="noopener">Kitchen book</a>
    </nav>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="app" aria-live="polite"></main>

  <div id="player" class="player" hidden>
    <button class="player-btn" id="player-toggle" aria-label="Pause"><svg><use href="#pause"/></svg></button>
    <div class="player-info">
      <div class="player-title" id="player-title">Their voice</div>
      <div class="player-bar"><div id="player-progress"></div></div>
    </div>
    <span class="player-time" id="player-time">0:00</span>
    <button class="player-close" id="player-close" aria-label="Stop">✕</button>
  </div>
  <audio id="voice" preload="metadata"></audio>

  <footer class="foot">
    <p>Everything stays on this laptop. Whisper + Gemma run locally and work with Wi-Fi off.</p>
  </footer>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
